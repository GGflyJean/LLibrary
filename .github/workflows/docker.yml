name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ggflyjean/llibrary:latest
            ghcr.io/ggflyjean/llibrary:${{ github.sha }}
      - name: Tag image for offline import
        run: |
          docker pull ghcr.io/ggflyjean/llibrary:${{ github.sha }}
          docker tag ghcr.io/ggflyjean/llibrary:${{ github.sha }} llibrary:local
      - name: Export image tarball
        run: docker save llibrary:local | gzip > llibrary-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: llibrary-image
          path: llibrary-image.tar.gz
          retention-days: 14
